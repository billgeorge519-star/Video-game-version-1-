; The Reality Machine — engine configuration.
; Multiplayer, voice and streaming are set here from day one on purpose:
; GDD 22 says design multiplayer from the beginning rather than adding it later.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/L_Trailer.L_Trailer
EditorStartupMap=/Game/Maps/L_Trailer.L_Trailer
ServerDefaultMap=/Game/Maps/L_LivingCity.L_LivingCity
GlobalDefaultGameMode=/Game/Core/GM_Reality.GM_Reality_C
TransitionMap=/Game/Maps/L_PortalTransition.L_PortalTransition

[/Script/Engine.GameEngine]
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="OnlineSubsystemUtils.IpNetDriver")

[/Script/OnlineSubsystemUtils.IpNetDriver]
; Shared realities carry a lot of players in one space (GDD 8).
MaxClientRate=25000
MaxInternetClientRate=25000
NetServerMaxTickRate=60
MaxNetTickRate=60
InitialConnectTimeout=60.0
ConnectionTimeout=45.0

[/Script/Engine.Player]
ConfiguredInternetSpeed=25000
ConfiguredLanSpeed=50000

[OnlineSubsystem]
DefaultPlatformService=EOS

[/Script/Engine.RendererSettings]
; Lumen + Nanite on the high tier; scalability tiers carry the rest (GDD 21).
r.DefaultFeature.AutoExposure=False
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.AllowStaticLighting=False
r.VelocitySeparateSceneCaptureQuality=1
r.Nanite.ProjectEnabled=True
r.SkinCache.CompileShaders=True

[/Script/WorldPartitionEditor.WorldPartitionEditorSettings]
CommandletClass=Class'/Script/UnrealEd.WorldPartitionConvertCommandlet'

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.0
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=6

[/Script/AudioMixer.AudioMixerSettings]
; Proximity voice (GDD 9) needs occlusion and distance attenuation, not a lobby mixer.
bAllowVirtualizedSources=True

[/Script/Engine.AudioSettings]
DefaultReverbSendLevel=0.0
